[package]
name = "webgl-api"
version = "0.1.0"
authors = ["Mattias"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.46"
wasm-bindgen = "0.2.69"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "0.8", features = ["v4", "wasm-bindgen", "v1", "serde"] }

[dependencies.web-sys]
version = "0.3.46"
features = [
  'Event',
  'EventTarget',
  'Worker',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
  'ErrorEvent',
  'console',
] 
