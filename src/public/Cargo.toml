[package]
name = "webgl-api"
version = "0.1.0"
authors = ["Mattias"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
uimsg = { path="../uimsg", version="0.1.1" }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "js", "v1", "serde"] }
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.91"
features = [
  'Event',
  'EventTarget',
  'Worker',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
  'ErrorEvent',
  'console',
] 
