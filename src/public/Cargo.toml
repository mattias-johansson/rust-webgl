[package]
name = "webgl-api"
version = "0.1.0"
authors = ["Mattias"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.46"
wasm-bindgen = "0.2.69"

[dependencies.web-sys]
version = "0.3.46"
features = [
  'Event',
  'EventTarget',
  'Worker',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
  'ErrorEvent',
  'console',
] 
