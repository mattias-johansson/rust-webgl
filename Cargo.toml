[package]
name = "webgl"
version = "0.1.1"
authors = ["Mattias"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
uimsg = { path="./src/uimsg", version="0.1.1" }
webgl-api = { path="./src/public", version="0.1.0" }
js-sys = "0.3.91"
wasm-bindgen = "0.2.114"
wasm-bindgen-futures = "0.4.64"
nalgebra = "0.34.1"
nalgebra-glm = "0.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
erased-serde = "0.4"
rand = "0.9.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["v4", "js", "v1", "serde"] }
makepad-ttf-parser = "0.1.0"
makepad-font = "0.1.0"
makepad-trapezoidator = "0.1.0"
makepad-geometry = "0.1.0"
makepad-internal-iter = "0.1.0"
makepad-path = "0.1.0"
console_error_panic_hook = "0.1.7"

[dependencies.web-sys]
version = "0.3.91"
features = [
  'CssStyleDeclaration',
  'Document',
  'Element',
  'Event',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'HtmlImageElement',
  'HtmlInputElement',
  'InputEvent',
  'MouseEvent',
  'Node',
  'Touch',
  'TouchEvent',
  'TouchList',
  'WebGlBuffer',
  'WebGlFramebuffer',
  'WebGlProgram',
  'WebGlRenderbuffer',
  'WebGlRenderingContext',
  'WebGlShader',
  'WebGlTexture',
  'WebGlUniformLocation',
  'WebGlVertexArrayObject',
  'WheelEvent',
  'Window',
  'Worker',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
  'ErrorEvent',
  'console',
] 

