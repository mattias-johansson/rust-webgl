[package]
name = "webgl"
version = "0.1.1"
authors = ["Mattias"]
edition = "2018"

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.46"
wasm-bindgen = "0.2.69"
wasm-bindgen-futures = "0.4.19"
nalgebra = "0.18.0"
nalgebra-glm = "=0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
erased-serde = "0.3"
rand = "0.7.3"
uuid = { version = "0.8", features = ["v4", "wasm-bindgen", "v1", "serde"] }
makepad-ttf-parser = "0.1.0"
makepad-font = "0.1.0"
makepad-trapezoidator = "0.1.0"
makepad-geometry = "0.1.0"
makepad-internal-iter = "0.1.0"
makepad-path = "0.1.0"
console_error_panic_hook = "0.1.6"

[dependencies.web-sys]
version = "0.3.46"
features = [
  'CssStyleDeclaration',
  'Document',
  'Element',
  'Event',
  'EventTarget',
  'HtmlCanvasElement',
  'HtmlElement',
  'HtmlImageElement',
  'HtmlInputElement',
  'InputEvent',
  'MouseEvent',
  'Node',
  'Touch',
  'TouchEvent',
  'TouchList',
  'WebGlBuffer',
  'WebGlFramebuffer',
  'WebGlProgram',
  'WebGlRenderbuffer',
  'WebGlRenderingContext',
  'WebGlShader',
  'WebGlTexture',
  'WebGlUniformLocation',
  'WebGlVertexArrayObject',
  'WheelEvent',
  'Window',
  'Worker',
  'DedicatedWorkerGlobalScope',
  'MessageEvent',
  'ErrorEvent',
  'console',
] 

