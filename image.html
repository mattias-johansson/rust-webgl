<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type"/>
  </head>
  <style>
  #app {
    width:100%;
    height:100%;
    margin:0%;
    background: #FFF;
  }
  canvas {
    width: 100%;
    height: 100%;
  } 
  </style>
  <body id="app">
    <canvas id="canvas" width="1280px" height="703px"/>
    <script src="/webgl.js"> </script>

    <script type=module>
      // Like with the `--target web` output the exports are immediately
      // available but they won't work until we initialize the module. Unlike
      // `--target web`, however, the globals are all stored on a
      // `wasm_bindgen` global. The global itself is the initialization
      // function and then the properties of the global are all the exported
      // functions.
      //
      // Note that the name `wasm_bindgen` can be configured with the
      // `--no-modules-global` CLI flag
      const { Application } = wasm_bindgen;

      async function run() {
        await wasm_bindgen('/webgl_bg.wasm');

        const application = new Application('image.js');
        application.start();

        let start_time;
        function eventLoop (time) {
          if(start_time === undefined) {
            start_time = time;
          }
          application.event_loop(time);
          window.requestAnimationFrame(eventLoop);
        }
        eventLoop ();
      }
      console.log("run");
      run();
      </script>
  </body>
</html>
